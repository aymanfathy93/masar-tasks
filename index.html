<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1f3f">
<title>مسار — مهامي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d63ed'/%3E%3Cpath d='m9 16.5 4.5 4.5L23 11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fc; --surface:#fff; --line:#e7ecf4; --line2:#f0f3f8; --ink:#0f1b33; --ink2:#334155; --mute:#6b7a90; --dim:#9aa6b8;
  --navy:#0c1f3f; --navy2:#152c55; --navy3:#1d3a6b;
  --blue:#1d63ed; --blue-50:#eaf1fe; --blue-100:#d6e4fd;
  --red:#ef4444; --red-50:#fdeeee; --orange:#f97316; --orange-50:#fff1e6; --amber:#f59e0b; --amber-50:#fef5e3;
  --green:#16a34a; --green-50:#e8f7ee; --purple:#8b5cf6; --purple-50:#f1ecfe; --gray-50:#f1f4f8;
  --r:14px; --sh:0 1px 2px rgba(15,27,51,.04),0 4px 16px rgba(15,27,51,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;font-size:14.5px;line-height:1.55}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
textarea{resize:vertical;min-height:90px}
.ic{flex:none;display:block}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#fff}
.login-form{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 24px}
.login-box{width:100%;max-width:360px;text-align:center}
.mark{width:44px;height:44px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.mark.big{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;box-shadow:0 10px 30px rgba(29,99,237,.3)}
.login-box h1{font-size:24px;font-weight:800}
.tagline{color:var(--mute);font-size:13px;margin:4px 0 28px}
.field{position:relative;margin-bottom:12px;text-align:right}
.field .ic{position:absolute;top:50%;right:12px;transform:translateY(-50%);color:var(--dim)}
.field input{padding:12px 42px 12px 42px;height:48px}
.field .eye{position:absolute;top:50%;left:8px;transform:translateY(-50%);color:var(--dim);padding:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-weight:700;font-size:14px;border:1px solid transparent;transition:filter .15s,background .15s}
.btn:disabled{opacity:.6;cursor:default}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.out{border-color:var(--line);background:#fff;color:var(--ink2)}
.btn.out:hover{background:var(--gray-50)}
.btn.danger{border-color:#f8c9c9;color:var(--red);background:#fff}
.btn.block{width:100%;height:48px}
.note{background:var(--blue-50);color:var(--blue);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;text-align:right}
.err{color:var(--red);font-size:13px;min-height:22px;margin-top:10px}
.login-hero{background:linear-gradient(160deg,#0c1f3f 0%,#163566 55%,#1d4ea8 100%);color:#fff;padding:56px 48px 40px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.login-hero h2{font-size:38px;font-weight:800;line-height:1.35}
.login-hero p{opacity:.8;margin-top:8px;font-size:15px}
.hero-art{flex:1;display:grid;place-items:center;margin:24px 0}
.hero-art svg{width:100%;max-width:420px;height:auto}
.hero-feats{display:flex;justify-content:space-around;border-top:1px solid rgba(255,255,255,.15);padding-top:22px}
.hero-feats div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;opacity:.9}

/* ---------- shell ---------- */
.side{position:fixed;top:0;bottom:0;right:0;width:244px;background:var(--navy);color:#cdd7e6;display:flex;flex-direction:column;padding:18px 14px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px}
.brand b{display:block;color:#fff;font-size:15px;font-weight:800;line-height:1.3}
.brand small{font-size:11px;color:#8ea2c2}
.brand .mark{width:36px;height:36px;border-radius:10px}
.me{display:flex;align-items:center;gap:10px;background:var(--navy2);border-radius:12px;padding:10px;margin-bottom:16px}
.av{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-size:15px}
.me b{color:#fff;display:block;font-size:13.5px}
.me small{color:#8ea2c2;font-size:11.5px}
.snav{display:flex;flex-direction:column;gap:2px;flex:1}
.snav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;color:#b9c6da}
.snav a:hover{background:var(--navy2);color:#fff}
.snav a.on{background:var(--blue);color:#fff}
.side-out{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#b9c6da;font-weight:600;border-top:1px solid var(--navy2);margin-top:8px}
.main{margin-right:244px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,247,252,.9);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:14px 28px}
.tb-brand{display:none;align-items:center;gap:10px;flex:1;min-width:0}
.tb-brand b{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsearch{position:relative;width:340px;margin-left:auto}
.gsearch .ic{position:absolute;top:50%;right:12px;transform:translateY(-50%);color:var(--dim)}
.gsearch input{padding-right:38px;height:40px;background:#fff}
.iconbtn{width:40px;height:40px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);position:relative;flex:none}
.iconbtn .dot{position:absolute;top:8px;left:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.tb-av{display:none}
.page{padding:6px 28px 40px;max-width:1240px}
.loadbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:99;overflow:hidden;display:none}
.loadbar.on{display:block}
.loadbar i{display:block;height:100%;width:40%;background:var(--blue);animation:lb 1s ease-in-out infinite}
@keyframes lb{from{transform:translateX(-120%)}to{transform:translateX(260%)}}
.bnav,.fab{display:none}

/* ---------- common ---------- */
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 18px}
.ph h1{font-size:22px;font-weight:800;flex:1}
.ph .sub{color:var(--mute);font-size:13px;width:100%;margin-top:-10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.card-h h3{font-size:15px;font-weight:800}
.card-h a,.lnk{color:var(--blue);font-size:13px;font-weight:600}
.pad{padding:16px 18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;background:var(--gray-50);color:var(--mute)}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.red{background:var(--red-50);color:var(--red)}
.chip.orange{background:var(--orange-50);color:var(--orange)}
.chip.amber{background:var(--amber-50);color:#d48806}
.chip.green{background:var(--green-50);color:var(--green)}
.chip.blue{background:var(--blue-50);color:var(--blue)}
.chip.purple{background:var(--purple-50);color:var(--purple)}
.empty{color:var(--dim);text-align:center;padding:36px 12px}
.grid2{display:grid;grid-template-columns:1fr 1.6fr;gap:16px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px;cursor:pointer;transition:transform .15s;border-top:3px solid var(--kc)}
.kpi:hover{transform:translateY(-2px)}
.kpi .kt{display:flex;align-items:center;justify-content:space-between;color:var(--kc);font-weight:700;font-size:13px}
.kpi .kt span{width:30px;height:30px;border-radius:9px;background:var(--kb);display:grid;place-items:center}
.kpi b{display:block;font-size:34px;font-weight:800;color:var(--kc);margin:6px 0 2px;line-height:1.2}
.kpi small{color:var(--mute);font-size:12px}
.delta{font-size:12px;font-weight:700}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}

/* brief */
.brief{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;margin-bottom:16px;background:linear-gradient(90deg,#fff 0%,#f5f8ff 100%);border-color:var(--blue-100)}
.brief .bi{width:36px;height:36px;border-radius:10px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;flex:none}
.brief b{font-size:13px;color:var(--blue)}
.brief b span{color:var(--dim);font-weight:500;margin-right:6px}
.brief p{white-space:pre-line;color:var(--ink2);line-height:1.8;margin-top:2px}

/* task rows */
.trow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line2);cursor:pointer}
.trow:hover{background:#fafbfe}
.pdot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 4px var(--pdb)}
.trow .tt{flex:1;min-width:0}
.trow .tt b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tt small{color:var(--mute);font-size:12px}
.cnote{font-size:12px;color:#8a6a1f;background:#fdf8ec;border-radius:8px;padding:3px 8px;margin-top:4px;display:inline-block;max-width:100%}
.circ{width:24px;height:24px;border-radius:50%;border:2px solid #cbd5e1;flex:none;display:grid;place-items:center;color:transparent;transition:.15s}
.circ:hover{border-color:var(--green);color:var(--green)}
.circ.done{background:var(--green);border-color:var(--green);color:#fff}
.score{font-weight:800;font-size:13px;color:var(--ink2);min-width:30px;text-align:center}

/* donut */
.donut-box{display:flex;align-items:center;gap:20px;padding:12px 18px 18px}
.donut{position:relative;flex:none}
.donut svg{transform:rotate(-90deg)}
.donut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .dc b{font-size:22px;font-weight:800;line-height:1.1}
.donut .dc small{font-size:11px;color:var(--mute)}
.legend{flex:1;display:flex;flex-direction:column;gap:9px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend .lv{margin-right:auto;color:var(--mute);font-weight:700}

/* table */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line2)}
.tabs{display:flex;gap:4px;background:var(--gray-50);padding:4px;border-radius:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap}
.tabs button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs button .n{font-size:11px;color:var(--dim);margin-right:4px}
.toolbar select{width:auto;height:36px;padding:0 10px}
.toolbar .srch{position:relative;flex:1;min-width:180px}
.toolbar .srch .ic{position:absolute;top:50%;right:10px;transform:translateY(-50%);color:var(--dim)}
.toolbar .srch input{height:36px;padding-right:34px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--mute);font-weight:700;text-align:right;padding:10px 12px;background:#fafbfe;border-bottom:1px solid var(--line2)}
.tbl td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.r{cursor:pointer}
.tbl tr.r:hover td{background:#fafbfe}
.tbl .tcol{display:flex;align-items:center;gap:12px}
.tbl .tcol b{font-weight:700}
.tbl .tcol small{display:block;color:var(--mute);font-size:12px}
.tbl .done-row b{text-decoration:line-through;color:var(--mute)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;color:var(--mute);font-size:13px}
.pager .pg{display:flex;gap:4px}
.pager button{min-width:32px;height:32px;border-radius:8px;border:1px solid var(--line);font-weight:700;color:var(--ink2);background:#fff}
.pager button.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* detail */
.dgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:700;font-size:13px;margin-bottom:10px}
.dh{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.dh h2{font-size:20px;font-weight:800;line-height:1.5}
.desc{color:var(--ink2);margin:10px 0 4px;white-space:pre-line;line-height:1.85}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.meta div{background:#fafbfe;border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.meta small{display:block;color:var(--mute);font-size:11.5px;margin-bottom:2px}
.meta b{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.cbox{display:flex;gap:10px;background:#fdf8ec;border:1px solid #f3e3b8;color:#7a5b14;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.8;margin-bottom:14px}
.cbox .ic{color:#d4a017;margin-top:3px}
.prog{height:8px;background:var(--gray-50);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);border-radius:8px}
.seg{display:flex;gap:4px;background:var(--gray-50);border-radius:10px;padding:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;padding:7px 6px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--mute)}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.lbl{font-size:13px;font-weight:700;color:var(--ink2);margin:16px 0 8px;display:flex;justify-content:space-between}
.bars2 .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);margin:10px 0 4px}
.bars2 .row b{color:var(--ink)}
.answers div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:13px}
.answers span{color:var(--mute)}
.answers b{font-weight:700;text-align:left}

/* form */
.fgrid{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.frow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fl{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
.fl em{color:var(--red);font-style:normal}
.qblock{border-top:1px solid var(--line2);margin-top:18px;padding-top:6px}
.qblock h4{font-size:15px;font-weight:800;margin:10px 0 2px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink2)}
.opt:hover{border-color:var(--blue-100)}
.opt.on{background:var(--blue-50);border-color:var(--blue);color:var(--blue)}
.preview{position:sticky;top:80px;text-align:center;padding:20px}
.preview .pv-l{font-weight:800;margin:10px 0 2px;font-size:15px}
.preview small{color:var(--mute)}
.preview .bars2{text-align:right;margin-top:10px}
.preview .donut{margin:0 auto}

/* categories */
.cat-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line2)}
.cat-row:first-child{border-top:0}
.cat-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.cat-row .cn{flex:1}
.cat-row .cn b{display:block;font-weight:800}
.cat-row .cn small{color:var(--mute)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.icg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icg button{height:40px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.icg button.on{border-color:var(--blue);background:var(--blue-50);color:var(--blue)}

/* calendar */
.calgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.cal-h{display:flex;align-items:center;gap:8px;padding:14px 18px}
.cal-h h3{flex:1;font-size:16px;font-weight:800}
.wd,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 12px}
.wd div{text-align:center;font-size:12px;color:var(--mute);font-weight:700;padding:6px 0}
.days{padding-bottom:14px}
.day{aspect-ratio:1/0.9;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:13.5px;cursor:pointer;position:relative}
.day:hover{background:var(--gray-50)}
.day.out{color:#c4ccd8}
.day.today span{background:var(--blue);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.day.sel{background:var(--blue-50);box-shadow:inset 0 0 0 1.5px var(--blue)}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%}
.ev{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line2);cursor:pointer}
.ev .bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.ev .tt{flex:1;min-width:0}
.ev b{display:block;font-weight:700}
.ev small{color:var(--mute);font-size:12px}

/* reports */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding:10px 18px 14px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;gap:6px}
.bars .stack{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.bars .col{width:70%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--blue);min-height:3px}
.bars .col.soft{background:var(--blue-100)}
.bars .col.over{background:var(--red)}
.bars .cap{position:absolute;left:0;right:0;border-top:2px dashed #94a3b8}
.bars .v{font-size:11.5px;font-weight:700;color:var(--ink2);min-height:16px}
.bars .l{font-size:11.5px;color:var(--mute);white-space:nowrap}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 18px 18px}
.mx div{border-radius:12px;padding:12px;background:var(--mb);color:var(--mc);cursor:pointer}
.mx b{font-size:26px;font-weight:800;display:block;line-height:1.2}
.mx small{font-size:12.5px;font-weight:700}
.ins{list-style:none;padding:4px 18px 16px}
.ins li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line2);line-height:1.75;font-size:13.5px}
.ins li:first-child{border-top:0}
.ins li .ii{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--gray-50)}

/* settings */
.sgrid{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.smenu{padding:8px}
.smenu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;font-weight:700;color:var(--ink2);text-align:right}
.smenu button.on{background:var(--blue-50);color:var(--blue)}
.prof{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line2);margin-bottom:6px}

const daysTxt = n => n === 1 ? 'يوم' : n === 2 ? 'يومين' : n <= 10 ? n + ' أيام' : n + ' يوم';
const fmtD = s => { const d = new Date(dayN(s) * 864e5); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]; };
const fmtT = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' ص' : ' م'); };
const greet = () => (new Date().getHours() < 12 ? 'صباح الخير' : 'مساء الخير') + ' يا ' + (DATA ? DATA.cfg.name : 'أيمن');
const catOf = name => (DATA && DATA.categories.find(c => c.name === name)) || {name: name || 'بدون تصنيف', color:'#94a3b8', icon:'tag'};
const byScore = (a, b) => b.score - a.score || (a.due || '9').localeCompare(b.due || '9');
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

function dueTxt(t) {
  if (!t.due) return 'بدون موعد';
  const d = dayN(t.due) - TN();
  let s = d < 0 ? 'متأخرة ' + daysTxt(-d) : d === 0 ? 'النهارده' : d === 1 ? 'بكره' : d <= 6 ? WD_SHORT[wday(dayN(t.due))] : fmtD(t.due);
  return s + (t.time ? ' · ' + fmtT(t.time) : '');
}
const priChip = t => isOpen(t) && PRI[t.pri] ? `<span class="chip ${PRI[t.pri].c}">${PRI[t.pri].n}</span>` : '<span class="chip">—</span>';
const stChip = t => isLate(t) ? '<span class="chip red dot">متأخرة</span>' : `<span class="chip dot ${ST[t.status] ? ST[t.status].c : ''}">${ST[t.status] ? ST[t.status].n : esc(t.status)}</span>`;

function ring(score, color, size = 64, sw = 7, center = '') {
  const r = (size - sw) / 2, c = 2 * Math.PI * r;
  return `<div class="donut" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#eef2f7" stroke-width="${sw}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${sw}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.max(0, Math.min(100, score)) / 100)}"/></svg>
    <div class="dc">${center}</div></div>`;
}
function donut(parts, size, center) {
  const sw = 16, r = (size - sw) / 2, c = 2 * Math.PI * r, tot = parts.reduce((s, p) => s + p.v, 0);
  let off = 0;
  const segs = tot ? parts.filter(p => p.v).map(p => { const len = p.v / tot * c; const s = `<circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${p.c}" stroke-width="${sw}" fill="none" stroke-dasharray="${Math.max(0, len - 2)} ${c}" stroke-dashoffset="${-off}"/>`; off += len; return s; }).join('') : '';
  return `<div class="donut" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#eef2f7" stroke-width="${sw}" fill="none"/>${segs}</svg><div class="dc">${center}</div></div>`;
}

function scoreOf(f) {
  const req = W.req[f.req] || 3, imp = W.imp[f.imp] || 3, con = W.con[f.con] || 3, link = f.link || 'none', lnk = W.link[link] || 1;
  let importance = ((req * .30 + imp * .35 + con * .25 + lnk * .10) - 1) / 4 * 100;
  const effort = (+f.effort || 2) * (1 - Math.min(100, +f.progress || 0) / 100);
  const effortDays = effort / ((DATA && DATA.cfg.work) || 4);
  let urgency, overdue = 0;
  if (f.due) {
    const left = dayN(f.due) - TN();
    if (left < 0) { overdue = -left; urgency = 100; }
    else { const s = left - effortDays; urgency = s <= 0 ? 95 : s <= 1 ? 85 : s <= 3 ? 72 : s <= 7 ? 52 : s <= 14 ? 32 : 15; }
  } else urgency = 18;
  if (link === 'blocking' || link === 'both') urgency += 12;
  const touched = f.updated || f.created;
  if (touched) urgency += Math.min(12, Math.floor((TN() - dayN(touched)) / 3) * 2);
  importance = Math.max(0, Math.min(100, importance)); urgency = Math.max(0, Math.min(100, urgency));
  const score = Math.round(Math.max(0, Math.min(100, importance * .55 + urgency * .45 + Math.max(-15, Math.min(15, +f.cadj || 0)))));
  const isImp = importance >= 55, isUrg = urgency >= 60;
  return {importance: Math.round(importance), urgency: Math.round(urgency), score,
    quad: isImp && isUrg ? 'Do' : isImp ? 'Plan' : isUrg ? 'Quick' : 'Later',
    pri: (score >= 75 || (overdue > 0 && isImp)) ? 'P1' : score >= 58 ? 'P2' : score >= 40 ? 'P3' : 'P4'};
}

/* ======================= API ======================= */
const apiUrl = () => API_URL || LS.get('masar_api') || '';
let busy = 0;
function setBusy(d) { busy = Math.max(0, busy + d); $('#loadbar').classList.toggle('on', busy > 0); }

async function api(action, payload = {}) {
  if (!apiUrl()) throw new Error('رابط الـAPI مش متسجل');
  setBusy(1);
  try {
    const res = await fetch(apiUrl(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({action, token: TOKEN}, payload))});
    const j = await res.json();
    if (!j.ok) {
      if (j.error === 'AUTH') { logoutLocal(); throw new Error('انتهت الجلسة — ادخل تاني'); }
      throw new Error(j.error || 'حصلت مشكلة');
    }
    return j.data;
  } catch (e) {
    if (e instanceof TypeError) throw new Error('مفيش اتصال بالسيرفر — اتأكد من النت أو رابط الـAPI');
    throw e;
  } finally { setBusy(-1); }
}

function setData(d) {
  DATA = d;
  LS.set('masar_data', JSON.stringify(d));
  render();
}

async function mutate(action, payload, okMsg) {
  try { const d = await api(action, payload); setData(d); if (okMsg) toast(okMsg); return true; }
  catch (e) { toast(e.message); return false; }
}

async function showLogin() {
  $('#app').classList.add('hidden');

  $('#apiField').classList.toggle('hidden', !!API_URL);

    try { const s = await api('status'); $('#firstRun').classList.toggle('hidden', s.hasPassword); }
    catch (e) { $('#lgErr').textContent = e.message; }
  }
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#lgErr').textContent = '';
  if (!API_URL) {
    const u = $('#lgApi').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) { $('#lgErr').textContent = 'حط رابط Web App صحيح من Apps Script'; return; }
    LS.set('masar_api', u);
  }
  const btn = $('#lgBtn'); btn.disabled = true; btn.innerHTML = ic('loader', 18);
  try {
    const r = await api('login', {user: $('#lgUser').value, pass: $('#lgPass').value});
    TOKEN = r.token; LS.set('masar_token', TOKEN);
    $('#lgPass').value = '';
    await boot();
  } catch (err) { $('#lgErr').textContent = err.message; }
  btn.disabled = false; btn.textContent = 'دخول';
});
$('#eyeBtn').onclick = () => { const p = $('#lgPass'); p.type = p.type === 'password' ? 'text' : 'password'; };

function logoutLocal() {
  TOKEN = null; DATA = null;
  LS.del('masar_token'); LS.del('masar_data');
  showLogin();
}

async function boot() {
  if (!TOKEN || !apiUrl()) { showLogin(); return; }
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  render();
  try { setData(await api('getData')); }
  catch (e) { if (TOKEN) toast(e.message); }
}

function quickDues() {
  const tn = TN(); let thu = tn + 1; while (wday(thu) !== 4) thu++;
  return [['النهارده', fromN(tn)], ['بكره', fromN(tn + 1)], ['الخميس الجاي', fromN(thu)], ['بعد أسبوع', fromN(tn + 7)], ['بدون موعد', '']];
}
function readForm() {
  FORM.title = $('#fTitle').value; FORM.notes = $('#fNotes').value; FORM.cat = $('#fCat').value;
  FORM.due = $('#fDue').value; FORM.time = $('#fTime').value;
}
function drawPreview() {
  const f = FORM, answered = QS.every(q => f[q.k] !== '' && f[q.k] != null);
  const s = scoreOf(f), p = PRI[s.pri], q = QUAD[s.quad];
  const sm = innerWidth <= 900;
  $('#preview').innerHTML = `${ring(answered ? s.score : 0, answered ? p.hex : '#cbd5e1', sm ? 58 : 130, sm ? 7 : 13, `<b class="num" ${sm ? 'style="font-size:16px"' : ''}>${answered ? s.score : '—'}</b>${sm ? '' : '<small>درجة الأولوية</small>'}`)}
    <div class="pv-info"><div class="pv-l">${answered ? `<span class="chip ${p.c}">${p.n}</span> <span class="chip" style="background:${q.b};color:${q.c}">${q.n}</span>` : 'جاوب الأسئلة'}</div>
    <div class="bars2">
      <div class="row"><span>الأهمية</span><b class="num">${answered ? s.importance : '–'}</b></div><div class="prog"><i style="width:${answered ? s.importance : 0}%;background:var(--orange)"></i></div>
      <div class="row"><span>الإلحاح</span><b class="num">${answered ? s.urgency : '–'}</b></div><div class="prog"><i style="width:${answered ? s.urgency : 0}%;background:var(--red)"></i></div>
    </div></div>`;
}
function bindForm(id) {
  if (!$('#preview')) return;
  drawPreview();
  const page = $('#page');
  page.querySelectorAll('[data-qk]').forEach(b => b.onclick = () => {
    FORM[b.dataset.qk] = b.dataset.qv;
    page.querySelectorAll(`[data-qk="${b.dataset.qk}"]`).forEach(x => x.classList.toggle('on', x === b));
    drawPreview();
  });
  page.querySelectorAll('[data-qdue]').forEach(b => b.onclick = () => {
    $('#fDue').value = b.dataset.qdue; FORM.due = b.dataset.qdue;
    page.querySelectorAll('[data-qdue]').forEach(x => x.classList.toggle('on', x === b)); drawPreview();
  });
  page.querySelectorAll('[data-fst]').forEach(b => b.onclick = () => {
    FORM.status = b.dataset.fst; if (FORM.status === 'منتهية') FORM.progress = 100;
    page.querySelectorAll('[data-fst]').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#fDue').onchange = () => { FORM.due = $('#fDue').value; page.querySelectorAll('[data-qdue]').forEach(x => x.classList.toggle('on', x.dataset.qdue === FORM.due)); drawPreview(); };
  $('#fSave').onclick = async () => {
    readForm();
    if (!FORM.title.trim()) { toast('اكتب عنوان المهمة'); $('#fTitle').focus(); return; }
    const miss = QS.find(q => FORM[q.k] === '' || FORM[q.k] == null);
    if (miss) { toast('جاوب: ' + miss.t); return; }
    const payload = {Title: FORM.title.trim(), Category: FORM.cat, Notes: FORM.notes.trim(), Due: FORM.due, DueTime: FORM.time,
      Requester: FORM.req, Impact: FORM.imp, Consequence: FORM.con, Effort: +FORM.effort, Link: FORM.link};
    const btn = $('#fSave'); btn.disabled = true;
    let ok;
    if (id) { payload.Status = FORM.status; payload.Progress = FORM.progress; ok = await doSave('updateTask', {id, patch: payload}, 'اتحفظت'); if (ok) { FORM = null; location.hash = '#task/' + id; } }
    else {
      try {
        const before = new Set(DATA.tasks.map(t => t.id));
        const d = await api('addTask', {task: payload});
        FORM = null; DATA = d; LS.set('masar_data', JSON.stringify(d));
        const nt = d.tasks.find(t => !before.has(t.id));
        toast('اتضافت'); location.hash = nt ? '#task/' + nt.id : '#tasks'; render(); ok = true;
      } catch (e) { toast(e.message); }
    }
    if (!ok && $('#fSave')) $('#fSave').disabled = false;
  };
}
async function doSave(action, payload, msg) {
  try { const d = await api(action, payload); DATA = d; LS.set('masar_data', JSON.stringify(d)); toast(msg); return true; }
  catch (e) { toast(e.message); return false; }
}

async function catSave() {

  const item = {name, color: CATS_EDIT.c.color, icon: CATS_EDIT.c.icon, old: CATS_EDIT.old};
  if (list.some((c, i) => c.name === name && i !== CATS_EDIT.idx)) { toast('الاسم ده موجود'); return; }

async function catDel(idx) {
  const c = DATA.categories[idx];
  if (DATA.categories.length === 1) { toast('لازم يفضل تصنيف واحد على الأقل'); return; }
  const used = DATA.tasks.filter(t => t.cat === c.name).length;
  confirmBox(`حذف تصنيف "${esc(c.name)}"؟`, used ? `${used} مهمة عليه هتفضل باسمه القديم.` : '', async () => {
    const list = DATA.categories.filter((_, i) => i !== idx).map(x => ({name: x.name, color: x.color, icon: x.icon, old: x.name}));
    await mutate('saveCategories', {categories: list}, 'اتحذف');
  });
}

/* ---------- calendar ---------- */
function pCal() {
  const tn = TN(), td = new Date(tn * 864e5);
  if (!UI.cal) UI.cal = {y: td.getUTCFullYear(), m: td.getUTCMonth()};
  if (!UI.calSel) UI.calSel = TODAY();
  const {y, m} = UI.cal;
  const first = Math.round(Date.UTC(y, m, 1) / 864e5);
  const lead = (wday(first) + 1) % 7;               // week starts Saturday
  const start = first - lead;
  const byDay = {};
  DATA.tasks.filter(t => t.due && t.status !== 'ملغاة').forEach(t => (byDay[t.due] = byDay[t.due] || []).push(t));
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const n = start + i, d = new Date(n * 864e5), s = fromN(n);
    if (i >= 35 && d.getUTCMonth() !== m) break;
    const l = (byDay[s] || []).sort(byScore);
    cells.push(`<div class="day ${d.getUTCMonth() !== m ? 'out' : ''} ${n === tn ? 'today' : ''} ${s === UI.calSel ? 'sel' : ''}" data-day="${s}">
      <span class="num">${d.getUTCDate()}</span><div class="dots">${l.slice(0, 3).map(t => `<i style="background:${t.status === 'منتهية' ? 'var(--green)' : (PRI[t.pri] || PRI.P4).hex}"></i>`).join('')}</div></div>`);
  }
  const sel = (byDay[UI.calSel] || []).sort((a, b) => (a.time || '99').localeCompare(b.time || '99') || byScore(a, b));
  const wdOrder = [6, 0, 1, 2, 3, 4, 5];
  return `<div class="ph"><h1>التقويم</h1><a class="btn pri" href="#new">${ic('plus', 18)}إضافة مهمة</a></div>
  <div class="calgrid">
    <div class="card">
      <div class="cal-h"><h3>${MONTHS[m]} ${y}</h3>
        <button class="iconbtn" data-cal="-1" aria-label="السابق">${ic('chevR', 18)}</button>
        <button class="btn out" style="height:40px" data-cal="0">النهارده</button>
        <button class="iconbtn" data-cal="1" aria-label="التالي">${ic('chevL', 18)}</button></div>
      <div class="wd">${wdOrder.map(i => `<div>${WD_SHORT[i]}</div>`).join('')}</div>
      <div class="days">${cells.join('')}</div>
    </div>
    <div class="card"><div class="card-h"><h3>${UI.calSel === TODAY() ? 'النهارده' : WD_SHORT[wday(dayN(UI.calSel))] + ' ' + fmtD(UI.calSel)}</h3><span class="chip num">${sel.length}</span></div>
      <div style="height:6px"></div>
      ${sel.length ? sel.map(t => `<div class="ev" data-go="#task/${esc(t.id)}"><span class="bar" style="background:${t.status === 'منتهية' ? 'var(--green)' : (PRI[t.pri] || PRI.P4).hex}"></span>
        <div class="tt"><b>${esc(t.title)}</b><small>${t.time ? fmtT(t.time) + ' · ' : ''}${esc(catOf(t.cat).name)}</small></div>${stChip(t)}</div>`).join('') : '<div class="empty">مفيش مهام في اليوم ده</div>'}
    </div>
  </div>`;
}

/* ---------- reports ---------- */
function pReports() {
  const tn = TN(), per = UI.period;
  const all = DATA.tasks.filter(t => t.status !== 'ملغاة'), open = all.filter(isOpen), late = open.filter(isLate);
  const done = all.filter(t => t.status === 'منتهية' && t.done);
  const inP = (s, a, b) => s && tn - dayN(s) >= a && tn - dayN(s) < b;
  const doneNow = done.filter(t => inP(t.done, 0, per)).length, donePrev = done.filter(t => inP(t.done, per, per * 2)).length;
  const newNow = all.filter(t => inP(t.created, 0, per)).length, newPrev = all.filter(t => inP(t.created, per, per * 2)).length;
  const delta = (a, b) => { if (!b) return a ? '<span class="delta up">جديد</span>' : ''; const d = Math.round((a - b) / b * 100); return `<span class="delta ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : ''}${d}%</span>`; };
  const dueDone = done.filter(t => t.due && inP(t.done, 0, Math.max(per, 30)));
  const onTime = dueDone.length ? pct(dueDone.filter(t => t.done <= t.due).length, dueDone.length) : null;
  const kpi = (title, v, c, extra) => `<div class="card kpi" style="--kc:${c};cursor:default"><div class="kt" style="color:var(--mute)">${title}</div><b class="num" style="color:var(--ink)">${v}</b>${extra || '<small>&nbsp;</small>'}</div>`;

  // by category
  const catParts = DATA.categories.map(c => ({n: c.name, c: c.color, v: open.filter(t => t.cat === c.name).length}));
  const other = open.filter(t => !DATA.categories.some(c => c.name === t.cat)).length;
  if (other) catParts.push({n: 'بدون تصنيف', c: '#94a3b8', v: other});

  // completion bars
  let bars;
  if (per === 7) bars = Array.from({length: 7}, (_, i) => { const n = tn - 6 + i; return {l: n === tn ? 'النهارده' : WD_SHORT[wday(n)], v: done.filter(t => dayN(t.done) === n).length, hi: n === tn}; });
  else bars = Array.from({length: 5}, (_, i) => { const k = 4 - i; return {l: k === 0 ? 'الأسبوع ده' : 'قبل ' + (k === 1 ? 'أسبوع' : k === 2 ? 'أسبوعين' : k + ' أسابيع'), v: done.filter(t => Math.floor((tn - dayN(t.done)) / 7) === k).length, hi: k === 0}; });
  const bMax = Math.max(1, ...bars.map(b => b.v));

  // workload next 7 days
  const days = Array.from({length: 7}, (_, i) => { const n = tn + i; return {n, load: 0, cap: DATA.cfg.workdays.includes(wday(n)) ? DATA.cfg.work : DATA.cfg.off}; });
  let noDue = 0;
  open.forEach(t => {
    const rem = t.effort * (1 - t.progress / 100);
    if (!t.due) { noDue++; return; }
    const left = dayN(t.due) - tn;
    if (left < 0) { days[0].load += rem; return; }
    if (left > 6) return;
    const span = days.slice(0, left + 1), cs = span.reduce((s, d) => s + d.cap, 0) || 1;
    span.forEach(d => d.load += rem * d.cap / cs);
  });
  const loadSum = days.reduce((s, d) => s + d.load, 0), capSum = days.reduce((s, d) => s + d.cap, 0);
  const wMax = Math.max(1, ...days.map(d => Math.max(d.load, d.cap)));

  const qc = {Do: 0, Plan: 0, Quick: 0, Later: 0}; open.forEach(t => { if (qc[t.quad] != null) qc[t.quad]++; });

  // insights
  const ins = [];
  if (late.length) { const w = late.slice().sort((a, b) => a.due.localeCompare(b.due))[0]; ins.push(['alert', 'var(--red)', `${late.length} مهمة متأخرة، أقدمهم "${esc(w.title)}" متأخرة ${daysTxt(tn - dayN(w.due))}.`]); }
  if (loadSum > capSum) ins.push(['clock', 'var(--orange)', `حمل الـ٧ أيام الجاية ${Math.round(loadSum)} ساعة والمتاح ${capSum} ساعة — محتاج تأجل أو تختصر حوالي ${Math.round(loadSum - capSum)} ساعة.`]);
  else { const od = days.filter(d => d.load > d.cap + .1); if (od.length) ins.push(['clock', 'var(--orange)', `ضغط على يوم ${od.map(d => WD_SHORT[wday(d.n)]).join(' و')} — اسحب شغل قبلها.`]); }
  const quick = open.filter(t => t.effort <= .5 && t.importance >= 55);
  if (quick.length) ins.push(['bolt', 'var(--amber)', `${quick.length} مهمة مهمة وبتاخد أقل من ساعة — ابدأ بيهم وانت فايق.`]);
  if (open.length >= 5 && qc.Quick / open.length > .4) ins.push(['trend', 'var(--purple)', `${pct(qc.Quick, open.length)}% من مهامك عاجلة بس مش مهمة — ده وقت بيتسحب من الحاجات اللي بتفرق.`]);
  const planNoDue = open.filter(t => t.quad === 'Plan' && !t.due);
  if (planNoDue.length) ins.push(['cal', 'var(--blue)', `${planNoDue.length} مهمة مهمة من غير موعد — المهم اللي ملوش موعد بيتأجل للأبد.`]);
  const stale = open.filter(t => (t.updated || t.created) && tn - dayN(t.updated || t.created) >= 7);
  if (stale.length) ins.push(['loader', 'var(--mute)', `${stale.length} مهمة متلمستش من أسبوع أو أكتر.`]);
  if (doneNow || donePrev) ins.push(['check', 'var(--green)', `خلصت ${doneNow} مهمة في آخر ${per} يوم مقابل ${donePrev} في الفترة اللي قبلها.`]);
  if (noDue) ins.push(['tag', 'var(--mute)', `${noDue} مهمة مفتوحة بدون موعد مش داخلة في حساب الحمل.`]);

  return `<div class="ph"><h1>التقارير والتحليلات</h1>
    <div class="tabs">${[[7, 'آخر 7 أيام'], [30, 'آخر 30 يوم']].map(([v, n]) => `<button class="${per === v ? 'on' : ''}" data-period="${v}">${n}</button>`).join('')}</div></div>
  <div class="kpis">
    ${kpi('مهام جديدة', newNow, '', delta(newNow, newPrev))}
    ${kpi('مكتملة', doneNow, '', delta(doneNow, donePrev))}
    ${kpi('مفتوحة', open.length, '', `<small>${late.length} متأخرة</small>`)}
    ${kpi('الالتزام بالمواعيد', onTime == null ? '—' : onTime + '%', '', '<small>آخر ' + Math.max(per, 30) + ' يوم</small>')}
  </div>
  <div class="rgrid">
    <div class="card"><div class="card-h"><h3>المفتوح حسب التصنيف</h3></div>
      <div class="donut-box">${donut(catParts, 150, `<b class="num">${open.length}</b><small>مهمة</small>`)}
        <div class="legend">${catParts.map(p => `<div><i style="background:${p.c}"></i>${esc(p.n)}<span class="lv num">${p.v} · ${pct(p.v, open.length)}%</span></div>`).join('')}</div></div></div>
    <div class="card"><div class="card-h"><h3>الإنجاز</h3></div>
      <div class="bars">${bars.map(b => `<div class="b"><span class="v num">${b.v || ''}</span><div class="stack"><div class="col ${b.hi ? '' : 'soft'}" style="height:${b.v / bMax * 100}%"></div></div><span class="l">${b.l}</span></div>`).join('')}</div></div>
    <div class="card"><div class="card-h"><h3>حمل الأسبوع الجاي</h3><span class="chip num">${Math.round(loadSum)} / ${capSum} ساعة</span></div>
      <div class="bars">${days.map(d => `<div class="b"><span class="v num">${d.load ? d.load.toFixed(1) : ''}</span><div class="stack">
        <div class="cap" style="bottom:${d.cap / wMax * 100}%"></div><div class="col ${d.load > d.cap + .1 ? 'over' : ''}" style="height:${d.load / wMax * 100}%"></div></div>
        <span class="l">${d.n === tn ? 'النهارده' : WD_SHORT[wday(d.n)]}</span></div>`).join('')}</div></div>
    <div class="card"><div class="card-h"><h3>مصفوفة الأولويات</h3></div>
      <div class="mx">${['Do', 'Plan', 'Quick', 'Later'].map(k => `<div style="--mb:${QUAD[k].b};--mc:${QUAD[k].c}" data-go="#tasks/open"><b class="num">${qc[k]}</b><small>${QUAD[k].n}</small></div>`).join('')}</div></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-h"><h3>Insights</h3></div>
    <ul class="ins">${ins.length ? ins.map(([i, c, t]) => `<li><span class="ii" style="color:${c}">${ic(i, 16)}</span><span>${t}</span></li>`).join('') : '<li><span class="ii">' + ic('check', 16) + '</span><span>ضيف مهام عشان تظهر التحليلات.</span></li>'}</ul></div>`;
}

/* ---------- settings ---------- */
function pSettings() {
  const tabs = [['profile', 'الملف الشخصي', 'user'], ['hours', 'ساعات العمل', 'clock'], ['security', 'الأمان', 'lock']];
  let body = '';
  if (UI.stab === 'profile') body = `<div class="prof"><span class="av">${esc((DATA.cfg.name || 'A').charAt(0))}</span><div><b style="font-size:16px">${esc(DATA.cfg.name)}</b><div style="color:var(--mute);font-size:13px">@${esc(DATA.cfg.user)}</div></div></div>
    <label class="fl">الاسم اللي يظهر</label><input id="sName" value="${esc(DATA.cfg.name)}" maxlength="30">
    <label class="fl">اسم المستخدم</label><input value="${esc(DATA.cfg.user)}" disabled dir="ltr">
    <div class="actions"><button class="btn pri" id="sSaveProfile">حفظ</button></div>`;
  else if (UI.stab === 'hours') body = `
    <div class="frow"><div><label class="fl">ساعات تركيز في يوم الشغل</label><input type="number" id="sWork" min="0" max="16" step="0.5" value="${DATA.cfg.work}"></div>
    <div><label class="fl">ساعات تركيز في يوم الأجازة</label><input type="number" id="sOff" min="0" max="16" step="0.5" value="${DATA.cfg.off}"></div></div>
    <label class="fl">أيام الشغل</label><div class="wdays">${[6, 0, 1, 2, 3, 4, 5].map(i => `<button class="${DATA.cfg.workdays.includes(i) ? 'on' : ''}" data-wd="${i}">${WD_SHORT[i]}</button>`).join('')}</div>
    <div class="actions"><button class="btn pri" id="sSaveHours">حفظ</button></div>`;
  else body = `<label class="fl">كلمة السر الحالية</label><input type="password" id="sOld" autocomplete="current-password">
    <label class="fl">كلمة السر الجديدة</label><input type="password" id="sNew" autocomplete="new-password">
    <label class="fl">تأكيد كلمة السر</label><input type="password" id="sNew2" autocomplete="new-password">
    <div class="actions"><button class="btn pri" id="sSavePass">تغيير كلمة السر</button><button class="btn danger" data-act="logout">${ic('out', 17)}تسجيل الخروج</button></div>`;
  return `<div class="ph"><h1>الإعدادات</h1></div>
  <div class="sgrid"><div class="card smenu">${tabs.map(([k, n, i]) => `<button class="${UI.stab === k ? 'on' : ''}" data-stab="${k}">${ic(i, 18)}${n}</button>`).join('')}</div>
  <div class="card pad">${body}</div></div>`;
}
function bindSettings() {
  const b1 = $('#sSaveProfile'); if (b1) b1.onclick = () => mutate('saveSettings', {settings: {name: $('#sName').value}}, 'اتحفظ');
  const b2 = $('#sSaveHours');
  if (b2) {
    const sel = new Set(DATA.cfg.workdays);
    document.querySelectorAll('[data-wd]').forEach(b => b.onclick = () => { const i = +b.dataset.wd; sel.has(i) ? sel.delete(i) : sel.add(i); b.classList.toggle('on'); });
    b2.onclick = () => mutate('saveSettings', {settings: {work: +$('#sWork').value, off: +$('#sOff').value, workdays: [...sel].sort()}}, 'اتحفظ');
  }
  const b3 = $('#sSavePass');
  if (b3) b3.onclick = async () => {
    if ($('#sNew').value !== $('#sNew2').value) { toast('كلمتين السر مش متطابقين'); return; }
    try { await api('changePassword', {oldPass: $('#sOld').value, newPass: $('#sNew').value}); toast('اتغيرت كلمة السر'); ['#sOld', '#sNew', '#sNew2'].forEach(s => $(s).value = ''); }
    catch (e) { toast(e.message); }
  };
}

/* ======================= ACTIONS ======================= */
let toastTimer;
function toast(msg, btnTxt, fn) {
  $('#toastMsg').textContent = msg;
  const b = $('#toastBtn'); b.textContent = btnTxt || ''; b.style.display = btnTxt ? '' : 'none';
  b.onclick = () => { $('#toast').classList.remove('show'); fn && fn(); };
  $('#toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('show'), btnTxt ? 5000 : 2600);
}
function openModal(html) { $('#mbox').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); }
function confirmBox(title, sub, onYes) {
  openModal(`<h3>${title}</h3>${sub ? `<p style="color:var(--mute)">${sub}</p>` : ''}<div class="actions"><button class="btn danger" id="cfYes">${ic('trash', 17)}تأكيد الحذف</button><button class="btn out" data-act="close">إلغاء</button></div>`);
  $('#cfYes').onclick = () => { closeModal(); onYes(); };
}

async function markDone(id) {
  const t = DATA.tasks.find(x => x.id === id); if (!t) return;
  const prev = t.status;
  t.status = 'منتهية'; t.done = TODAY(); t.progress = 100; render();
  try {
    setData(await api('updateTask', {id, patch: {Status: 'منتهية'}}));
    toast('برافو، خلصت ✓', 'تراجع', () => mutate('updateTask', {id, patch: {Status: prev}}));
  } catch (e) { t.status = prev; render(); toast(e.message); }
}

function toggleMenu(show) {
  const m = $('#menu');
  if (show === false || !m.classList.contains('hidden')) { m.classList.add('hidden'); return; }
  m.innerHTML = `<a href="#categories">${ic('folder', 18)}التصنيفات</a><a href="#settings">${ic('gear', 18)}الإعدادات</a><button data-act="logout">${ic('out', 18)}تسجيل الخروج</button>`;
  m.classList.remove('hidden');
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-done],[data-del],[data-go],[data-act],[data-tab],[data-pg],[data-st],[data-progress],[data-day],[data-cal],[data-period],[data-stab],[data-catedit],[data-catdel]');
  if (!e.target.closest('#menu') && !e.target.closest('[data-act="menu"]')) toggleMenu(false);
  if (!el) { if (e.target.id === 'modal') closeModal(); return; }
  const d = el.dataset;
  if (d.done) { e.preventDefault(); e.stopPropagation(); markDone(d.done); return; }
  if (d.del) { const t = DATA.tasks.find(x => x.id === d.del); confirmBox(`حذف "${esc(t ? t.title : '')}"؟`, 'الحذف نهائي.', async () => { if (await mutate('deleteTask', {id: d.del}, 'اتحذفت')) location.hash = '#tasks'; }); return; }
  if (d.go) { location.hash = d.go; return; }
  if (d.tab) { UI.tab = d.tab; UI.page = 1; location.hash = '#tasks/' + d.tab; render(); return; }
  if (d.pg) { UI.page = +d.pg; render(); window.scrollTo(0, 0); return; }
  if (d.st) { mutate('updateTask', {id: d.id, patch: {Status: d.st}}, 'اتحدثت'); return; }
  if (d.progress) { mutate('updateTask', {id: d.id, patch: {Progress: +d.progress}}, 'اتحدث التقدم'); return; }
  if (d.day) { UI.calSel = d.day; const dd = new Date(dayN(d.day) * 864e5); if (dd.getUTCMonth() !== UI.cal.m) UI.cal = {y: dd.getUTCFullYear(), m: dd.getUTCMonth()}; render(); return; }
  if (d.cal) {
    if (d.cal === '0') { UI.cal = null; UI.calSel = TODAY(); }
    else { let m = UI.cal.m + (+d.cal), y = UI.cal.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } UI.cal = {y, m}; }
    render(); return;
  }
  if (d.period) { UI.period = +d.period; render(); return; }
  if (d.stab) { UI.stab = d.stab; render(); return; }
  if (d.catedit) { catModal(+d.catedit); return; }
  if (d.catdel) { catDel(+d.catdel); return; }
  switch (d.act) {
    case 'logout': toggleMenu(false); try { await api('logout'); } catch (x) {} logoutLocal(); break;
    case 'menu': toggleMenu(); break;
    case 'close': closeModal(); break;
    case 'catAdd': catModal(null); break;
    case 'catSave': catSave(); break;
    case 'brief':
      openModal(`<h3>ملاحظة Claude<button data-act="close">${ic('x', 20)}</button></h3>
        ${DATA && DATA.brief ? `<p style="color:var(--mute);font-size:12.5px;margin-bottom:8px">${DATA.briefDate ? fmtD(DATA.briefDate) : ''}</p><p style="white-space:pre-line;line-height:1.9">${esc(DATA.brief)}</p>` : '<p style="color:var(--mute)">مفيش ملاحظة لسه — المراجعة بتتعمل كل يوم الصبح.</p>'}`);
      break;
  }
});

$('#gsearch').addEventListener('input', e => {
  UI.q = e.target.value.trim(); UI.page = 1; UI.tab = 'all';
  if (location.hash !== '#tasks/all') location.hash = '#tasks/all'; else render();
});
window.addEventListener('hashchange', () => { if (!routeParts()[0].match(/^(new|edit)$/)) FORM = null; window.scrollTo(0, 0); render(); });
document.querySelectorAll('[data-ic]').forEach(fillIcon);
$('#lgMark').innerHTML = ic('check', 32);
$('#icUser').innerHTML = ic('user', 18); $('#icLock').innerHTML = ic('lock', 18); $('#icLink').innerHTML = ic('link', 18);
$('#eyeBtn').innerHTML = ic('eye', 18);
$('#fab').innerHTML = ic('plus', 26);
boot();
</script>
</body>
</html>
